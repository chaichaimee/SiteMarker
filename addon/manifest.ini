name = SiteMarker
summary = "SiteMarker"
description = """SiteMarker streamlines web navigation for NVDA users by bookmarking specific webpage elements for instant access. Key features include site and marker managers, customizable search scopes, and automatic element clicking for hard to reach buttons, saving time on complex pages.

Hot Keys:
Windows+F12
Single Tap : Add or Edit Marker
Double Tap : open Site Manager
Triple Tap : open Marker Manager"""
