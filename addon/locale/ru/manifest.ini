summary = "Закладки сайта"
description = """SiteMarker упрощает навигацию по веб-страницам для пользователей NVDA, сохраняя определенные элементы веб-страниц в закладки для быстрого доступа. Основные функции включают в себя менеджеры сайтов и маркеров, настраиваемые области поиска и автоматический клик по элементам для труднодоступных кнопок, что экономит время на сложныx страницах.

Горячие клавиши:
Windows+F12
Одиночное нажатие: добавить или изменить маркер
Двойное нажатие: открыть менеджер сайтов
Тройное нажатие: открыть менеджер маркеров"""