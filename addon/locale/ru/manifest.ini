summary = "SiteMarker"
description = """SiteMarker упрощает веб-навигацию для пользователей NVDA, добавляя закладки на определенные элементы веб-страниц для быстрого доступа. Основные функции включают в себя менеджеры сайтов и маркеров, настраиваемые области поиска и автоматический клик по элементам для труднодоступных кнопок, экономя время на сложных страницах.

Hot Keys:
Windows+F12
Single Tap : Добавить или изменить маркер
Double Tap : Открыть менеджер сайтов
Triple Tap : Открыть менеджер маркеров"""