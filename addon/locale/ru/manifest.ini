summary = "SiteMarker"
description = """SiteMarker упрощает навигацию по веб-страницам для пользователей NVDA, добавляя в закладки определенные элементы веб-страниц для мгновенного доступа. Основные функции включают в себя менеджеры сайтов и маркеров, настраиваемые области поиска и автоматический клик по элементам для труднодоступных кнопок, что экономит время на сложныx страницах.

Горячие клавиши:
Windows+F12
Одиночное нажатие: Добавить или изменить маркер
Двойное нажатие: открыть менеджер сайтов
Тройное нажатие: открыть менеджер маркеров"""