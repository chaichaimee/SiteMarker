summary = "SiteMarker"
description = """SiteMarker vereinfacht die Webnavigation für NVDA-Benutzer, indem es bestimmte Webseitenelemente als Lesezeichen für den sofortigen Zugriff speichert. Zu den Hauptfunktionen gehören Website- und Markierungsverwaltung, anpassbare Suchbereiche und das automatische Klicken auf schwer erreichbare Schaltflächen, was Zeit auf komplexen Seiten spart.

Kurzbefehle:
Windows+F12
Einfach-Tippen: Markierung hinzufügen oder bearbeiten
Doppelt-Tippen: Website-Verwaltung öffnen
Dreifach-Tippen: Markierungsverwaltung öffnen"""