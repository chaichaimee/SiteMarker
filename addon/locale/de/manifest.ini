summary = "SiteMarker"
description = """SiteMarker vereinfacht die Webnavigation für NVDA-Benutzer, indem es bestimmte Webseitenelemente für den Sofortzugriff mit Lesezeichen versehen kann. Zu den Hauptfunktionen gehören Website- und Markierungsverwaltung, anpassbare Suchbereiche und das automatische Klicken auf schwer zugängliche Schaltflächen, was auf komplexen Seiten Zeit spart.

Tastenkombinationen:
Windows+F12
Einfach-Tippen: Markierung hinzufügen oder bearbeiten
Doppeltippen: Website-Verwaltung öffnen
Dreifachtippen: Markierungsverwaltung öffnen"""