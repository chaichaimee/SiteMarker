summary = "SiteMarker"
description = """SiteMarker vereinfacht die Webnavigation für NVDA-Benutzer, indem es bestimmte Webseitenelemente für den sofortigen Zugriff mit Lesezeichen versehen lässt. Zu den Hauptfunktionen gehören Website- und Marker-Manager, anpassbare Suchbereiche und automatisches Anklicken von Elementen für schwer erreichbare Schaltflächen, was Zeit auf komplexen Seiten spart.

Hot Keys:
Windows+F12
Single Tap : Marker hinzufügen oder bearbeiten
Double Tap : Website-Manager öffnen
Triple Tap : Marker-Manager öffnen"""