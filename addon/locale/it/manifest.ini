summary = "SiteMarker"
description = """SiteMarker memudahkan navigasi web bagi pengguna NVDA dengan menandai elemen halaman web tertentu untuk akses instan. Fitur utama mencakup pengelola situs dan penanda, cakupan pencarian yang dapat disesuaikan, dan pengklikan elemen otomatis untuk tombol yang sulit dijangkau, menghemat waktu pada halaman yang rumit.

Tombol Pintas:
Windows+F12
Ketukan Tunggal: Tambah atau Edit Penanda
Ketukan Ganda: buka Pengelola Situs
Ketiga Ketukan: buka Pengelola Penanda"""