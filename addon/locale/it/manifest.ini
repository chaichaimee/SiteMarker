summary = "SiteMarker"
description = """SiteMarker semplifica la navigazione web per gli utenti NVDA aggiungendo segnalibri a specifici elementi delle pagine web per un accesso immediato. Le funzionalità chiave includono gestori di siti e marker, ambiti di ricerca personalizzabili e il clic automatico sugli elementi per i pulsanti difficili da raggiungere, risparmiando tempo su pagine complesse.

Hot Keys:
Windows+F12
Single Tap : Aggiungi o modifica marker
Double Tap : Apri Gestione siti
Triple Tap : Apri Gestione marker"""