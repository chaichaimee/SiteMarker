summary = "SiteMarker"
description = """SiteMarker memudahkan navigasi web bagi pengguna NVDA dengan menandai elemen halaman web tertentu untuk akses instan. Fitur utamanya mencakup pengelola situs dan penanda, cakupan pencarian yang dapat disesuaikan, dan pengeklikan elemen otomatis untuk tombol yang sulit dijangkau, sehingga menghemat waktu pada halaman yang rumit.

Tombol Pintas:
Windows+F12
Ketuk Sekali: Tambah atau Edit Penanda
Ketuk Dua Kali: buka Pengelola Situs
Ketuk Tiga Kali: buka Pengelola Penanda"""