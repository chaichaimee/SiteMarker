summary = "SiteMarker"
description = """SiteMarker menyederhanakan navigasi web untuk pengguna NVDA dengan menandai elemen halaman web tertentu untuk akses instan. Fitur utama meliputi pengelola situs dan penanda, cakupan pencarian yang dapat disesuaikan, dan klik elemen otomatis untuk tombol yang sulit dijangkau, menghemat waktu di halaman yang kompleks.

Hot Keys:
Windows+F12
Single Tap : Tambah atau Edit Penanda
Double Tap : Buka Pengelola Situs
Triple Tap : Buka Pengelola Penanda"""