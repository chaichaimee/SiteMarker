summary = "Penanda Situs"
description = """Penanda Situs menyederhanakan navigasi web bagi pengguna NVDA dengan menandai elemen halaman web tertentu untuk akses instan. Fitur utamanya meliputi pengelola situs dan penanda, cakupan pencarian yang dapat disesuaikan, dan pengeklikan elemen otomatis untuk tombol yang sulit dijangkau, menghemat waktu pada halaman yang kompleks.

Tombol Pintas:
Windows+F12
Ketukan Tunggal: Tambah atau Edit Penanda
Ketukan Ganda: buka Pengelola Situs
Ketukan Tiga Kali: buka Pengelola Penanda"""