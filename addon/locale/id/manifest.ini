summary = "Penanda Situs"
description = """Penanda Situs memperlancar navigasi web bagi pengguna NVDA dengan menandai elemen halaman web tertentu untuk akses instan. Fitur utamanya mencakup pengelola situs dan penanda, cakupan pencarian yang dapat disesuaikan, serta pengeklikan elemen otomatis untuk tombol yang sulit dijangkau, menghemat waktu pada halaman yang kompleks.

Tombol Pintas:
Windows+F12
Ketukan Tunggal: Tambah atau Ubah Penanda
Ketukan Ganda: Buka Pengelola Situs
Ketukan Tiga Kali: Buka Pengelola Penanda"""