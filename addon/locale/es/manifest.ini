summary = "SiteMarker"
description = """SiteMarker facilita la navegación web para los usuarios de NVDA marcando elementos específicos de páginas web para un acceso instantáneo. Sus funciones clave incluyen administradores de sitios y marcadores, ámbitos de búsqueda personalizables y clics automáticos en elementos para botones difíciles de alcanzar, lo que ahorra tiempo en páginas complejas.

Teclas rápidas:
Windows+F12
Un toque: Añadir o editar marcador
Doble toque: Abrir administrador de sitios
Triple toque: Abrir administrador de marcadores"""