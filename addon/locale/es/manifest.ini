summary = "Marcador de sitios"
description = """SiteMarker optimiza la navegación web para los usuarios de NVDA mediante la marcación de elementos específicos de páginas web para un acceso instantáneo. Sus funciones clave incluyen gestores de sitios y de marcadores, ámbitos de búsqueda personalizables y la pulsación automática de elementos para botones difíciles de alcanzar, lo que ahorra tiempo en páginas complejas.

Teclas rápidas:
Windows+F12
Un toque: Añadir o editar marcador
Doble toque: Abrir el gestor de sitios
Triple toque: Abrir el gestor de marcadores"""