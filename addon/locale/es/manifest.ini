summary = "SiteMarker"
description = """SiteMarker simplifica la navegación web para los usuarios de NVDA mediante el uso de marcadores en elementos específicos de páginas web para un acceso instantáneo. Las características principales incluyen administradores de sitios y marcadores, ámbitos de búsqueda personalizables y el clic automático en elementos para botones difíciles de alcanzar, ahorrando tiempo en páginas complejas.

Hot Keys:
Windows+F12
Single Tap : Agregar o editar marcador
Double Tap : Abrir Administrador de Sitios
Triple Tap : Abrir Administrador de Marcadores"""