summary = "SiteMarker"
description = """SiteMarker simplifie la navigation web pour les utilisateurs de NVDA en mémorisant des éléments de page web spécifiques pour un accès instantané. Les fonctionnalités clés incluent des gestionnaires de sites et de marqueurs, des portées de recherche personnalisables et le clic automatique sur les éléments pour les boutons difficiles à atteindre, ce qui fait gagner du temps sur les pages complexes.

Raccourcis clavier :
Windows+F12
Appui simple : Ajouter ou modifier un marqueur
Double appui : Ouvrir le gestionnaire de sites
Triple appui : Ouvrir le gestionnaire de marqueurs"""