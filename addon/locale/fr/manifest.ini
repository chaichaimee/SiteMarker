summary = "SiteMarker"
description = """SiteMarker simplifie la navigation web pour les utilisateurs de NVDA en mémorisant des éléments de page web spécifiques pour un accès instantané. Ses principales fonctionnalités incluent des gestionnaires de sites et de repères, des portées de recherche personnalisables et le clic automatique sur des éléments pour les boutons difficiles d'accès, ce qui fait gagner du temps sur les pages complexes.

Raccourcis clavier :
Windows+F12
Un seul appui : Ajouter ou modifier le repère
Double appui : Ouvrir le gestionnaire de sites
Triple appui : Ouvrir le gestionnaire de repères"""