summary = "SiteMarker"
description = """SiteMarker simplifie la navigation Web pour les utilisateurs de NVDA en marquant des éléments de page Web spécifiques pour un accès instantané. Les principales fonctionnalités incluent des gestionnaires de sites et de marqueurs, des portées de recherche personnalisables et le clic automatique sur les éléments pour les boutons difficiles d'accès, ce qui permet de gagner du temps sur les pages complexes.

Hot Keys:
Windows+F12
Single Tap : Ajouter ou modifier un marqueur
Double Tap : Ouvrir le gestionnaire de sites
Triple Tap : Ouvrir le gestionnaire de marqueurs"""