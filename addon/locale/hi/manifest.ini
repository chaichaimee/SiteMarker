summary = "साइटमार्कर"
description = """साइटमार्कर विशिष्ट वेबपेज तत्वों को तुरंत एक्सेस के लिए बुकमार्क करके एनवीडीए (NVDA) उपयोगकर्ताओं के लिए वेब नेविगेशन को सरल बनाता है। मुख्य विशेषताओं में साइट और मार्कर मैनेजर, अनुकूलन योग्य खोज स्कोप, और कठिन बटनों तक आसानी से पहुँचने के लिए स्वचालित तत्व क्लिक करना शामिल है, जिससे जटिल पृष्ठों पर समय की बचत होती है।

हॉट कीज़:
विंडोज+F12
सिंगल टैप: मार्कर जोड़ें या संपादित करें
डबल टैप: साइट मैनेजर खोलें
ट्रिपल टैप: मार्कर मैनेजर खोलें"""