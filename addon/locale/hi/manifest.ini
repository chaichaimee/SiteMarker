summary = "SiteMarker"
description = """SiteMarker विशिष्ट वेबपेज तत्वों को बुकमार्क करके त्वरित पहुंच के लिए NVDA उपयोगकर्ताओं के लिए वेब नेविगेशन को सरल बनाता है। मुख्य विशेषताओं में साइट और मार्कर प्रबंधक, अनुकूलन योग्य खोज दायरे, और कठिन पहुंच वाले बटनों के लिए स्वचालित तत्व क्लिक करना शामिल है, जिससे जटिल पृष्ठों पर समय की बचत होती है।

Hot Keys:
Windows+F12
Single Tap : मार्कर जोड़ें या संपादित करें
Double Tap : साइट मैनेजर खोलें
Triple Tap : मार्कर मैनेजर खोलें"""