summary = "साइटमार्कर"
description = """साइटमार्कर विशिष्ट वेबपेज तत्वों को तुरंत एक्सेस करने के लिए बुकमार्क करके NVDA उपयोगकर्ताओं के लिए वेब नेविगेशन को आसान बनाता है। मुख्य विशेषताओं में साइट और मार्कर मैनेजर, कस्टमाइज़ करने योग्य खोज स्कोप, और कठिन बटनों तक पहुँचने के लिए स्वचालित तत्व क्लिकिंग शामिल हैं, जिससे जटिल पृष्ठों पर समय की बचत होती है।

हॉट कीज़:
Windows+F12
सिंगल टैप: मार्कर जोड़ें या संपादित करें
डबल टैप: साइट मैनेजर खोलें
ट्रिपल टैप: मार्कर मैनेजर खोलें"""