summary = "SiteMarker"
description = """SiteMarker ช่วยให้การท่องเว็บสำหรับผู้ใช้ NVDA สะดวกยิ่งขึ้นด้วยการบุ๊กมาร์กองค์ประกอบเฉพาะของหน้าเว็บเพื่อให้เข้าถึงได้ทันที ฟีเจอร์หลักประกอบด้วยตัวจัดการเว็บไซต์และมาร์กเกอร์, ขอบเขตการค้นหาที่ปรับแต่งได้, และการคลิกองค์ประกอบอัตโนมัติสำหรับปุ่มที่เข้าถึงยาก ช่วยประหยัดเวลาในหน้าเว็บที่มีความซับซ้อน

Hot Keys:
Windows+F12
Single Tap : เพิ่มหรือแก้ไขมาร์กเกอร์
Double Tap : เปิดตัวจัดการเว็บไซต์
Triple Tap : เปิดตัวจัดการมาร์กเกอร์"""