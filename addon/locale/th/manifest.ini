summary = "SiteMarker"
description = """SiteMarker ช่วยให้การท่องเว็บของผู้ใช้ NVDA สะดวกยิ่งขึ้นด้วยการบุ๊กมาร์กองค์ประกอบเฉพาะบนหน้าเว็บเพื่อให้เข้าถึงได้ทันทัติ ฟีเจอร์หลักประกอบด้วยตัวจัดการเว็บไซต์และมาร์กเกอร์ ขอบเขตการค้นหาที่ปรับแต่งได้ และการคลิกองค์ประกอบอัตโนมัติสำหรับปุ่มที่เข้าถึงยาก ช่วยประหยัดเวลาบนหน้าเว็บที่ซับซ้อน

คีย์ลัด:
Windows+F12
แตะครั้งเดียว: เพิ่มหรือแก้ไขมาร์กเกอร์
แตะสองครั้ง: เปิดตัวจัดการเว็บไซต์
แตะสามครั้ง: เปิดตัวจัดการมาร์กเกอร์"""