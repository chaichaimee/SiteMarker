summary = "ไซต์มาร์กเกอร์ (SiteMarker)"
description = """SiteMarker ช่วยให้ผู้ใช้ NVDA ท่องเว็บได้สะดวกรวดเร็วยิ่งขึ้นโดยการคั่นหน้าองค์ประกอบเฉพาะของเว็บเพจเพื่อให้เข้าถึงได้ทันทียังไงล่ะ ฟีเจอร์หลักประกอบด้วยตัวจัดการไซต์และมาร์กเกอร์ ขอบเขตการค้นหาที่ปรับแต่งได้ และการคลิกองค์ประกอบอัตโนมัติสำหรับปุ่มที่เข้าถึงยาก ช่วยประหยัดเวลาในหน้าเว็บที่มีความซับซ้อน

คีย์ลัด:
Windows+F12
แตะครั้งเดียว : เพิ่มหรือแก้ไขมาร์กเกอร์
แตะสองครั้ง : เปิดตัวจัดการไซต์
แตะสามครั้ง : เปิดตัวจัดการมาร์กเกอร์"""