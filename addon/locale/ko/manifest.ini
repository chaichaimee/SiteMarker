summary = "SiteMarker"
description = """SiteMarker는 특정 웹페이지 요소를 북마크하여 즉시 액세스할 수 있도록 함으로써 NVDA 사용자의 웹 내비게이션을 간소화합니다. 주요 기능에는 사이트 및 마커 관리자, 사용자 지정 가능한 검색 범위, 도달하기 어려운 버튼에 대한 자동 요소 클릭이 포함되어 복잡한 페이지에서 시간을 절약해 줍니다.

Hot Keys:
Windows+F12
Single Tap : 마커 추가 또는 편집
Double Tap : 사이트 관리자 열기
Triple Tap : 마커 관리자 열기"""