summary = "SiteMarker"
description = """O SiteMarker otimiza a navegação na web para usuários do NVDA, salvando elementos específicos de páginas da web para acesso instantâneo. Os principais recursos incluem gerenciadores de sites e marcadores, escopos de pesquisa personalizáveis e clique automático em elementos para botões difíceis de alcançar, economizando tempo em páginas complexas.

Teclas de Atalho:
Windows+F12
Toque único: Adicionar ou editar marcador
Toque duplo: Abrir gerenciador de sites
Toque triplo: Abrir gerenciador de marcadores"""