summary = "SiteMarker"
description = """O SiteMarker simplifica a navegação na web para usuários do NVDA, marcando elementos específicos de páginas da web para acesso instantâneo. Os principais recursos incluem gerenciadores de sites e de marcadores, escopos de pesquisa personalizáveis e cliques automáticos em elementos para botões difíceis de alcançar, economizando tempo em páginas complexas.

Teclas de Atalho:
Windows+F12
Toque Único: Adicionar ou Editar Marcador
Toque Duplo: abrir Gerenciador de Sites
Toque Triplo: abrir Gerenciador de Marcadores"""