summary = "SiteMarker"
description = """SiteMarker simplifica a navegação na web para usuários do NVDA marcando elementos específicos de páginas web para acesso instantâneo. Os principais recursos incluem gerenciadores de sites e marcadores, escopos de pesquisa personalizáveis e clique automático de elementos para botões de difícil acesso, economizando tempo em páginas complexas.

Hot Keys:
Windows+F12
Single Tap : Adicionar ou Editar Marcador
Double Tap : Abrir Gerenciador de Sites
Triple Tap : Abrir Gerenciador de Marcadores"""