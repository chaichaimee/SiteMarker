summary = "SiteMarker"
description = """يُبسط SiteMarker تصفح الويب لمستخدمي NVDA من خلال وضع إشارات مرجعية على عناصر معينة في صفحات الويب للوصول الفوري. تشمل الميزات الرئيسية مديري المواقع والإشارات المرجعية، ونطاقات البحث القابلة للتخصيص، والنقر التلقائي على العناصر للأزرار التي يصعب الوصول إليها، مما يوفر الوقت على الصفحات المعقدة.

Hot Keys:
Windows+F12
Single Tap : إضافة أو تعديل إشارة مرجعية
Double Tap : فتح مدير المواقع
Triple Tap : فتح مدير الإشارات المرجعية"""