summary = "SiteMarker"
description = """يعمل SiteMarker على تبسيط تصفح الويب لمستخدمي NVDA من خلال حفظ عناصر معينة في صفحات الويب للوصول إليها فوراً. تتضمن الميزات الرئيسية مديرين للمواقع والعلامات، ونطاقات بحث قابلة للتخصيص، والنقر التلقائي على العناصر للأزرار التي يسهل الوصول إليها، مما يوفر الوقت في الصفحات المعقدة.

اختصارات لوحة المفاتيح:
Windows+F12
نقرة واحدة: إضافة أو تعديل علامة
نقرة مزدوجة: فتح مدير المواقع
ثلاث نقرات: فتح مدير العلامات"""