summary = "معلم المواقع"
description = """يسهل معلم المواقع تصفح الويب لمستخدمي إن في دي إيه عن طريق وضع علامات مرجعية على عناصر محددة في صفحات الويب للوصول الفوري إليها. تتضمن الميزات الرئيسية مديرين للمواقع والعلامات، ونطاقات بحث قابلة للتخصيص، والنقر التلقائي على العناصر للأزرار التي ي صعب الوصول إليها، مما يوفر الوقت في الصفحات المعقدة.

مفاتيح الاختصار:
Windows+F12
نقرة واحدة: إضافة أو تحرير علامة
نقرة مزدوجة: فتح مدير المواقع
ثلاث نقرات: فتح مدير العلامات"""