summary = "SiteMarker"
description = """SiteMarkerは、特定のウェブページ要素をブックマークして即座にアクセスできるようにすることで、NVDAユーザーのウェブナビゲーションを効率化します。主な機能には、サイトおよびマーカーマネージャー、カスタマイズ可能な検索範囲、アクセスが困難なボタンの自動要素クリックが含まれており、複雑なページでの時間を節約できます。

Hot Keys:
Windows+F12
Single Tap : マーカーの追加または編集
Double Tap : サイトマネージャーを開く
Triple Tap : マーカーマネージャーを開く"""