summary = "SiteMarker"
description = """SiteMarker спрощує веб-навігацію для користувачів NVDA, створюючи закладки для певних елементів веб-сторінок для миттєвого доступу. Основні функції включають менеджери сайтів та маркерів, налаштовувані області пошуку та автоматичне натискання елементів для важкодоступних кнопок, що економить час на складних сторінках.

Hot Keys:
Windows+F12
Single Tap : Додати або змінити маркер
Double Tap : Відкрити менеджер сайтів
Triple Tap : Відкрити менеджер маркерів"""