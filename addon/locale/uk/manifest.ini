summary = "SiteMarker"
description = """SiteMarker спрощує навігацію в інтернеті для користувачів NVDA шляхом створення закладки на визначені елементи вебсторінки для миттєвого доступу. Основні функції включають менеджери сайтів і маркерок, налаштовувані області пошуку та автоматичне натискання елементів для важкодоступних кнопок, заощаджуючи час на складних сторінках.

Гарячі клавіші:
Windows+F12
Одинарне торкання: додати або змінити маркер
Подвійне торкання: відкрити менеджер сайтів
Потрійне торкання: відкрити менеджер маркерок"""